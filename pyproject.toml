[project]
name = "tractoflow"
version = "0.1.0"
description = "Diffusion Tensor Imaging (DTI) and Deterministic/Probabilistic Streamline Fiber Tractography Engine for Brain Connectomics"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tractoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
